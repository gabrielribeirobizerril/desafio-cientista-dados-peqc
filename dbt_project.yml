
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'rmi_educacao'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'rmi_educacao'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
# Imagens usadas na página inicial do dbt docs (models/visao_geral.md).
asset-paths: ["assets"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  rmi_educacao:
    # Dicionário de dados no BigQuery: grava as descrições do YAML nas
    # tabelas, views e colunas (visíveis no console e no INFORMATION_SCHEMA).
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

vars:
  # LDB, art. 24, VI: frequência mínima de 75% das horas letivas.
  # Única definição do limite do absenteísmo crônico no projeto.
  percentual_frequencia_minima: 75
