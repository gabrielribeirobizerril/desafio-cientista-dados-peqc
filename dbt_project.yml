# Projeto dbt do desafio RMI: camadas staging → intermediate → marts.
name: 'rmi_educacao'
version: '1.0.0'

# Perfil de conexão (ver profiles.yml.example).
profile: 'rmi_educacao'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
# Imagens usadas na página inicial do dbt docs (models/visao_geral.md).
asset-paths: ["assets"]

# Pastas apagadas pelo `dbt clean`.
clean-targets:
  - "target"
  - "dbt_packages"

models:
  rmi_educacao:
    # Dicionário de dados no BigQuery: grava as descrições do YAML nas
    # tabelas, views e colunas (visíveis no console e no INFORMATION_SCHEMA).
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

vars:
  # LDB, art. 24, VI: frequência mínima de 75% das horas letivas.
  # Única definição do limite do absenteísmo crônico no projeto.
  percentual_frequencia_minima: 75
