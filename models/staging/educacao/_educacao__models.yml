version: 2

models:
  - name: stg_educacao__avaliacao
    description: >
      Staging da tabela avaliacao: uma linha por aluno e bimestre, com as notas
      das disciplinas em colunas. Renomeia colunas, padroniza id_aluno (hex),
      converte bimestre para inteiro e remove apenas linhas idênticas.
      A chave aluno + bimestre ainda não é única (578 linhas em conflito),
      tratadas na camada intermediate.
    columns:
      - name: id_aluno
        data_type: string
        description: >
          Identificador anonimizado do aluno em hexadecimal (34 caracteres),
          padronizado pela macro formatar_id_aluno. Todos existem em aluno.

      - name: id_turma
        data_type: int64
        description: >
          Turma em que o aluno estava no bimestre (hash com salt). Difere da
          turma final (aluno.id_turma) para 9,4% dos alunos avaliados, por mudança
          de turma ao longo do ano. É a ponte para a escola do registro.

      - name: bimestre
        data_type: int64
        description: >
          Bimestre do ano letivo, de 1 a 4. Convertido de STRING na staging.

      - name: percentual_frequencia_bimestre
        data_type: float64
        description: >
          Percentual de frequência geral do aluno no bimestre, de 0 a 100.
          Fonte do indicador de absenteísmo crônico. Contém nulos.

      - name: nota_portugues
        data_type: float64
        description: >
          Nota de Língua Portuguesa, de 0 a 10, com ruído de ±0,2 da anonimização.
          Nula quando não lançada (cerca de 16% das linhas); nulo não equivale a zero.

      - name: nota_ciencias
        data_type: float64
        description: >
          Nota de Ciências, de 0 a 10, com ruído de ±0,2 da anonimização.
          Nula quando não lançada (cerca de 16% das linhas); nulo não equivale a zero.

      - name: nota_ingles
        data_type: float64
        description: >
          Nota de Língua Estrangeira (Inglês). 100% nula na carga atual; mantida
          para espelhar a fonte e excluída das análises de desempenho.

      - name: nota_matematica
        data_type: float64
        description: >
          Nota de Matemática, de 0 a 10, com ruído de ±0,2 da anonimização.
          Nula quando não lançada (cerca de 16% das linhas); nulo não equivale a zero.